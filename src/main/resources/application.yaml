server:
  port: 8080

spring:
  application:
    name: "epam"

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
    show_sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.yaml
    drop-first: false

  profiles:
    active: dev

management:
  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: backend
