services:
  trainer:
    build:
      context: .
      dockerfile: trainer/Dockerfile
    restart: unless-stopped
    networks:
      - fitness-net
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - ACTIVEMQ_HOST=activemq
      - ACTIVEMQ_PORT=61616
      - EUREKA_URI=http://eureka:8761/eureka
    depends_on:
      mongo:
        condition: service_healthy
      eureka:
        condition: service_healthy
      activemq:
        condition: service_healthy

  fitness:
    build:
      context: .
      dockerfile: fitness/Dockerfile
    restart: unless-stopped
    networks:
      - fitness-net
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - ACTIVEMQ_HOST=activemq
      - ACTIVEMQ_PORT=61616
      - EUREKA_URI=http://eureka:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
      activemq:
        condition: service_healthy

  eureka:
    build:
      context: .
      dockerfile: EurekuServer/Dockerfile
    restart: unless-stopped
    networks:
      - fitness-net
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8761/eureka/apps"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16.2-alpine
    restart: unless-stopped
    networks:
      - fitness-net
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    restart: unless-stopped
    networks:
      - fitness-net
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "-u", "${MONGO_USER}", "-p", "${MONGO_PASS}",
              "--authenticationDatabase", "admin",
              "--eval", "if (!db.hello().isWritablePrimary) { quit(1) }" ]
      interval: 10s
      timeout: 5s
      retries: 5

  activemq:
    image: apache/activemq:6.3.2
    restart: unless-stopped
    networks:
      - fitness-net
    ports:
      - "127.0.0.1:${ACTIVEMQ_PORT:-61616}:61616"
      - "127.0.0.1:8161:8161"
    environment:
      ACTIVEMQ_CONNECTION_USER: ${ACTIVEMQ_BROKER_USER}
      ACTIVEMQ_CONNECTION_PASSWORD: ${ACTIVEMQ_BROKER_PASSWORD}
      ACTIVEMQ_WEB_USER: ${ACTIVEMQ_BROKER_USER}
      ACTIVEMQ_WEB_PASSWORD: ${ACTIVEMQ_BROKER_PASSWORD}
    volumes:
      - activemq_data:/opt/apache-activemq/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/61616'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  fitness-net:
    name: fitness-net
    driver: bridge

volumes:
  db_data:
  mongo_data:
  activemq_data:
